name: sanjoyapp_print
description: SANJOY打印中转App - 接收Web端打印数据，通过BLE发送到标签打印机
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shared_preferences: ^2.2.2
  http: ^1.2.0
  cupertino_icons: ^1.0.6
  # 钉到 2.0.x：2.1.x 的 path_provider_android 已迁移到 JNI(jnigen)，
  # 会拉入 broken 的 jni 1.0.1，导致 CI Gradle 评估 ':jni' 失败
  # (Could not find method kotlin())。2.0.x 仍是 MethodChannel，无 jni 依赖。
  path_provider: ">=2.0.0 <2.1.0"
  path_provider_android: ">=2.0.0 <2.1.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true